[extend]
useDefault = true

[[allowlists]]
description = "Vendored upstream libghostty-vt sources: CI secret references and Zig literals, not our credentials"
paths = ['''^vendor/libghostty-vt/''']

[[allowlists]]
description = "Upstream Windows notification test: a fixed u128 activation token literal, not a credential"
paths = ['''^src/platform/windows/notifications\.rs$''']
regexes = ['''0x0123456789abcdef_fedcba9876543210u128''']
